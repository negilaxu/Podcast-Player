<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ce9aff37fa.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Navigation -->
    <div class="nav-wrapper">
        <nav class="nav">
            <h1 class="nav-title">Podcast Player</h1>
            <i class="fas fa-microphone-alt"></i>
            <!-- Mobile Navigation -->
             <div class="nav-list">
                <span id="searchLink" class="selected">Search</span>
                <span id="listenLink">Listen</span>
             </div>
        </nav>
    </div>

    <div class="page-wrapper">
        <!-- Search Container -->
        <div class="search-container">
            <!-- Search History -->
            <div class="custom-select">
                <select name="searchHistory" id="searchHistory" title="searchHistory">
                    <option value="">Select a Previous Search</option>
                </select>
            </div>
            <!-- Search Input -->
            <input type="text" name="search" id="searchInput" placeholder="Search by Podcast / Topic">
            <!-- Search Buttons -->
            <div class="search-buttons">
                <button type="button" id="searchButton">Search</button>
                <button type="button" id="resetButton">Clear History</button>
            </div>
        </div>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Loader -->
            <div class="loader-container">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
            </div>
            <!-- Cards Container -->
            <div id="response" class="cards-container">
            </div>
        </div>

        <!-- Player Container  -->
        <div class="player-container">
            <div class="player">
                <!-- Image -->
                <div class="img-container">
                    <img id="image" src="./default-podcast.png" alt="podcast image">
                </div>
                <!-- Title Container -->
                <div class="title-container">
                    <h2 id="title">Podcast Title</h2>
                    <h3 id="datePublished">Date Published</h3>
                </div>
                <!-- Audio Element -->
                <audio id="player" src=""></audio>
                <!-- Progress -->
                <div class="controls-container">
                    <div class="progress-container" id="progress-container">
                        <div class="progress" id="progress"></div>
                        <div class="duration-wrapper">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                    <!-- Controls -->
                    <div class="player-controls">
                        <i class="fas fa-backward" id="prev" title="-15 seconds"></i>
                        <i class="fas fa-play main-button" id="play" title="play"></i>
                        <i class="fas fa-forward" id="next" title="+15 seconds"></i>
                    </div>
                </div>
            </div>

            <!-- Queue -->
            <div class="queue">
                <div class="queue-item">
                    <img src="default-podcast.png" alt="episode title">
                    <div class="queue-content">
                        <h3>Episode Title is going, Hahahaha</h3>
                        <div class="icon-container">
                            <i class="fas fa-play-circle mb-10" title="play podcast"></i>
                            <i class="fas fa-trash-alt" title="remove from queue"></i>
                        </div>
                    </div>
                </div>
                <div class="queue-item">
                    <img src="default-podcast.png" alt="episode title">
                    <div class="queue-content">
                        <h3>Episode Title is going here, Hahahaha</h3>
                        <div class="icon-container">
                            <i class="fas fa-play-circle mb-10" title="play podcast"></i>
                            <i class="fas fa-trash-alt" title="remove from queue"></i>
                        </div>
                    </div>
                </div>
                <div class="queue-item">
                    <img src="default-podcast.png" alt="episode title">
                    <div class="queue-content">
                        <h3>Episode Title is going here, Hahahaha</h3>
                        <div class="icon-container">
                            <i class="fas fa-play-circle mb-10" title="play podcast"></i>
                            <i class="fas fa-trash-alt" title="remove from queue"></i>
                        </div>
                    </div>
                </div>
                <div class="queue-item">
                    <img src="default-podcast.png" alt="episode title">
                    <div class="queue-content">
                        <h3>Episode Title is going here, Hahahaha</h3>
                        <div class="icon-container">
                            <i class="fas fa-play-circle mb-10" title="play podcast"></i>
                            <i class="fas fa-trash-alt" title="remove from queue"></i>
                        </div>
                    </div>
                </div>
                <div class="queue-item">
                    <img src="default-podcast.png" alt="episode title">
                    <div class="queue-content">
                        <h3>Episode Title is going here, Hahahaha</h3>
                        <div class="icon-container">
                            <i class="fas fa-play-circle mb-10" title="play podcast"></i>
                            <i class="fas fa-trash-alt" title="remove from queue"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
